<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRKT — Photography</title>
  <meta name="description" content="Oliver Birkett — photographer based in London." />

  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root {
      --black: #000000;
      --white: #ffffff;
      --grey:  #888;
      --gap:   4px;
    }

    /* ═══════════════════════════════════════
       BASE
    ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: .03em;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ═══════════════════════════════════════
       LAYOUT — split: left third / right two-thirds
    ═══════════════════════════════════════ */
    .page {
      display: grid;
      grid-template-columns: 1fr 2fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════
       LEFT PANEL
    ═══════════════════════════════════════ */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
      position: relative;
    }
    .brkt-logo {
      width: 80%;
      max-width: 240px;
      height: auto;
      display: block;
    }
    .bio {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      right: 2rem;
      font-size: 12px;
      line-height: 1.7;
      color: #444;
      letter-spacing: .01em;
      text-align: center;
    }
    .bio a {
      border-bottom: 1px solid #ccc;
      transition: border-color .2s;
    }
    .bio a:hover { border-color: var(--black); }

    /* ═══════════════════════════════════════
       RIGHT PANEL — 2-col infinite scroll
    ═══════════════════════════════════════ */
    .right-panel {
      overflow: hidden;
      position: relative;
      height: 100vh;
    }

    /* Two columns side by side, each scrolling independently */
    .scroll-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 0;
      height: 100%;
    }

    .scroll-col {
      overflow: hidden;
      position: relative;
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 0;
      animation-name: scrollUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }

    .scroll-track img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    @keyframes scrollUp {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    /* ═══════════════════════════════════════
       MOBILE — stack layout
    ═══════════════════════════════════════ */
    @media (max-width: 700px) {
      html, body { overflow: auto; }

      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        overflow: visible;
      }

      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 1.8rem 1.2rem;
      }

      .brkt-logo { max-width: 180px; }

      .right-panel {
        height: 80vh;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- ── LEFT PANEL ── -->
    <aside class="left-panel">
      <img class="brkt-logo" src="assets/brkt-logo.png" alt="BRKT" />
      <p class="bio">
        Placeholder — Oliver's bio text goes here. London-based photographer
        working across editorial, portrait and commercial. Available for commissions.
        <br><br>
        <a href="mailto:hello@birkettoliverphoto.com">Get in touch</a>
      </p>
    </aside>

    <!-- ── RIGHT PANEL — scrolling gallery ── -->
    <main class="right-panel" id="right-panel">
      <div class="scroll-columns">
        <div class="scroll-col col-1">
          <div class="scroll-track" id="col1-track"></div>
        </div>
        <div class="scroll-col col-2">
          <div class="scroll-track" id="col2-track"></div>
        </div>
      </div>
    </main>

  </div>

  <script>
    const col1 = document.getElementById('col1-track');
    const col2 = document.getElementById('col2-track');
    const rightPanel = document.getElementById('right-panel');
    const isMobile = window.innerWidth <= 700;

    function buildColumn(el, photos) {
      [...photos, ...photos].forEach(p => {
        const img = document.createElement('img');
        img.src = p.file;
        img.alt = p.alt || '';
        img.loading = 'lazy';
        el.appendChild(img);
      });
    }

    fetch('photos.json')
      .then(r => r.json())
      .then(data => {
        const allPhotos = isMobile && data.photos_mobile ? data.photos_mobile : data.photos;
        const left  = allPhotos.filter((_, i) => i % 2 === 0);
        const right = allPhotos.filter((_, i) => i % 2 !== 0);

        buildColumn(col1, left);
        buildColumn(col2, right);

        const duration = left.length * 12;
        col1.style.animationDuration = duration + 's';
        col2.style.animationDuration = duration + 's';

        // ── Wheel scroll on right panel only — doesn't scroll the page ──
        let trackHeight = 0;
        let offset = 0;
        let paused = false;
        let resumeTimer = null;

        setTimeout(() => { trackHeight = col1.scrollHeight / 2; }, 500);
        window.addEventListener('load', () => { trackHeight = col1.scrollHeight / 2; });

        function getAnimY(el) {
          return new DOMMatrix(window.getComputedStyle(el).transform).m42;
        }

        rightPanel.addEventListener('wheel', e => {
          e.preventDefault();

          if (!paused) {
            offset = getAnimY(col1);
            col1.style.animationPlayState = 'paused';
            col2.style.animationPlayState = 'paused';
            paused = true;
          }

          offset -= e.deltaY * 0.6;

          if (trackHeight > 0) {
            offset = ((offset % trackHeight) - trackHeight) % trackHeight;
          }

          col1.style.transform = `translateY(${offset}px)`;
          col2.style.transform = `translateY(${offset}px)`;

          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(() => {
            const pct = Math.abs(offset) / (trackHeight || 1);
            const elapsed = pct * duration;
            col1.style.animationDelay = `-${elapsed}s`;
            col2.style.animationDelay = `-${elapsed}s`;
            col1.style.transform = '';
            col2.style.transform = '';
            col1.style.animationPlayState = 'running';
            col2.style.animationPlayState = 'running';
            paused = false;
          }, 2000);

        }, { passive: false });
      })
      .catch(() => {
        col1.innerHTML = '<p style="color:#999;padding:1rem;font-size:11px">No photos found.</p>';
      });
  </script>

</body>
</html>
