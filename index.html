<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRKT — Photography</title>
  <meta name="description" content="Oliver Birkett — photographer based in London." />

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: .03em;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ── LAYOUT ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 2fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      position: relative;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
    }

    /* Logo: truly centred in the panel */
    .brkt-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 200px;
      height: auto;
      display: block;
    }

    /* Bio + instagram pinned to bottom */
    .left-footer {
      position: absolute;
      bottom: 25vh;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1.5rem;
    }

    .bio {
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: 9.5px;
      line-height: 1.55;
      color: #000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-align: center;
    }

    .insta-link {
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: 9.5px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #000;
      text-decoration: none;
    }
    .insta-link:hover {
      opacity: 0.5;
    }

    /* Instagram · Contact · TikTok row */
    .social-links {
      /* 3 columns: Contact sits in the exact centre whatever the side words' lengths */
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .6rem;
      width: 100%;
    }
    .social-links a:first-child { justify-self: end; }
    .social-links a:last-child { justify-self: start; }
    .social-links a {
      border: 1px solid #000;
      line-height: 1;
      /* capitals have no descenders, so add a little more space on top to look even */
      padding: .42em .6em .28em;
    }
    @supports (text-box: trim-both cap alphabetic) {
      /* modern browsers: trim the text box to the capital letters so padding is exactly even */
      .social-links a {
        text-box: trim-both cap alphabetic;
        padding: .45em .6em;
      }
    }
    .social-links a:hover {
      background: #000;
      color: #fff;
      opacity: 1;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      overflow: hidden;
      position: relative;
      height: 100vh;
    }

    .scroll-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
    }

    .scroll-col {
      overflow: hidden;
      position: relative;
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 0;
      will-change: transform;
    }

    .scroll-track img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Small photos: two or more sit side by side in one row, scaled to the same height (no cropping, no gaps) */
    .scroll-track .pair {
      display: flex;
    }
    .scroll-track .pair img {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      height: auto;
    }

    /* ── MOBILE FOOTER ── */
    .mobile-footer {
      display: none;
    }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      html, body { overflow: auto; height: auto; }
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        height: auto;
        overflow: visible;
      }
      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        min-height: 160px;
        height: 160px;
      }
      .left-footer { display: none; }
      .brkt-logo { max-width: 120px; }
      .right-panel {
        height: auto;
        overflow: visible;
      }
      .scroll-columns {
        height: auto;
      }
      .scroll-col {
        overflow: visible;
      }
      .scroll-track {
        transform: none !important;
      }
      .mobile-hero {
        width: 100%;
        height: auto;
      }
      .mobile-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        padding: 2rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <img class="brkt-logo" src="assets/brkt-logo.png" alt="BRKT" />
      <div class="left-footer">
        <p class="bio">Oliver Birkett is a photographer based in London.</p>
        <nav class="social-links">
        <a class="insta-link" href="https://instagram.com/_birkettoliver" target="_blank" rel="noopener" >Instagram</a>
        <a class="insta-link" href="mailto:contact@birkettoliver.com">Contact</a>
        <a class="insta-link" href="https://www.tiktok.com/@birkettoliver" target="_blank" rel="noopener" >TikTok</a>
      </nav>
      </div>
    </aside>

    <!-- RIGHT PANEL — scrolling gallery -->
    <main class="right-panel" id="right-panel">
      <div class="scroll-columns">
        <div class="scroll-col">
          <div class="scroll-track" id="col1-track"></div>
        </div>
        <div class="scroll-col">
          <div class="scroll-track" id="col2-track"></div>
        </div>
      </div>
    </main>

    <!-- MOBILE FOOTER -->
    <footer class="mobile-footer">
      <p class="bio">Oliver Birkett is a photographer based in London.</p>
      <nav class="social-links">
        <a class="insta-link" href="https://instagram.com/_birkettoliver" target="_blank" rel="noopener" >Instagram</a>
        <a class="insta-link" href="mailto:contact@birkettoliver.com">Contact</a>
        <a class="insta-link" href="https://www.tiktok.com/@birkettoliver" target="_blank" rel="noopener" >TikTok</a>
      </nav>
    </footer>

  </div>

  <script>
    const col1 = document.getElementById('col1-track');
    const col2 = document.getElementById('col2-track');
    const rightPanel = document.getElementById('right-panel');
    const isMobile = window.innerWidth <= 700;

    function makeImg(p, eager) {
      const img = document.createElement('img');
      img.src = p.file;
      img.alt = p.alt || '';
      img.loading = eager ? 'eager' : 'lazy';
      if (p.start) img.dataset.start = '1';
      return img;
    }

    function buildColumn(el, photos, doubled) {
      const list = doubled ? [...photos, ...photos] : photos;
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        // a run of "small" photos in the same column shares one row
        if (p.size === 'small' && list[i + 1] && list[i + 1].size === 'small') {
          const row = document.createElement('div');
          row.className = 'pair';
          while (i < list.length && list[i].size === 'small') {
            const img = makeImg(list[i], true);
            img.onload = () => { img.style.flexGrow = img.naturalWidth / img.naturalHeight; };
            row.appendChild(img);
            i++;
          }
          el.appendChild(row);
          i--;
          continue;
        }
        // load first few eagerly so height is known before scroll starts
        el.appendChild(makeImg(p, i < 6));
      }
    }

    fetch('photos.json')
      .then(r => r.json())
      .then(data => {
        let allPhotos = isMobile && data.photos_mobile ? data.photos_mobile : data.photos;

        // Mobile: the "start" photo (the eye) sits full width at the top, then the grid below
        if (isMobile) {
          const hero = allPhotos.find(p => p.start);
          if (hero) {
            allPhotos = allPhotos.filter(p => p !== hero);
            const img = makeImg({ file: hero.file, alt: hero.alt }, true);
            img.className = 'mobile-hero';
            rightPanel.insertBefore(img, rightPanel.firstChild);
          }
          // photos marked "wide" span both columns at the bottom of the grid
          allPhotos.filter(p => p.wide).forEach(p => {
            const img = makeImg({ file: p.file, alt: p.alt }, true);
            img.className = 'mobile-hero';
            rightPanel.appendChild(img);
          });
          allPhotos = allPhotos.filter(p => !p.wide);
        }
        // photos can be pinned to a column with "col": "L" / "R" (used on mobile to keep both columns level)
        const pinned = allPhotos.some(p => p.col);
        const left  = pinned ? allPhotos.filter(p => p.col !== 'R') : allPhotos.filter((_, i) => i % 2 === 0);
        const right = pinned ? allPhotos.filter(p => p.col === 'R') : allPhotos.filter((_, i) => i % 2 !== 0);

        buildColumn(col1, left, !isMobile);
        buildColumn(col2, right, !isMobile);

        // Open the gallery at the photo marked "start" in photos.json (the blue BRKT eye)
        const startImg = document.querySelector('.scroll-track img[data-start]');
        let startOffset = 0;
        const ready = new Promise(resolve => {
          if (!startImg) return resolve();
          rightPanel.style.opacity = '0';
          const track = startImg.closest('.scroll-track');
          const imgs = [...track.querySelectorAll('img')];
          const before = imgs.slice(0, imgs.indexOf(startImg) + 1);
          before.forEach(img => { img.loading = 'eager'; });
          Promise.all(before.map(img => img.complete ? null :
            new Promise(r => { img.addEventListener('load', r); img.addEventListener('error', r); })))
            .then(resolve);
          setTimeout(resolve, 4000); // never wait forever
        }).then(() => {
          if (startImg) {
            const viewH = isMobile ? window.innerHeight : rightPanel.clientHeight;
            if (isMobile) {
              const top = startImg.getBoundingClientRect().top + window.scrollY;
              window.scrollTo(0, Math.max(0, top - (viewH - startImg.offsetHeight) / 2));
            } else {
              startOffset = Math.max(0, startImg.offsetTop - (viewH - startImg.offsetHeight) / 2);
            }
          }
          rightPanel.style.transition = 'opacity .4s';
          rightPanel.style.opacity = '1';
        });

        // Mobile: make both columns end level (stretch the last photo of the shorter column slightly)
        if (isMobile) {
          const all = [...document.querySelectorAll('.scroll-track img')];
          Promise.all(all.map(img => { img.loading = 'eager'; return img.complete ? null :
            new Promise(r => { img.addEventListener('load', r); img.addEventListener('error', r); }); }))
            .then(() => {
              const level = () => {
                [col1, col2].forEach(c => { const l = c.lastElementChild; if (l) { l.style.height = ''; l.style.objectFit = ''; } });
                const gap = col1.offsetHeight - col2.offsetHeight;
                const shorter = gap > 0 ? col2 : col1;
                const last = shorter.lastElementChild;
                if (!last || Math.abs(gap) < 1 || Math.abs(gap) > last.offsetHeight * 0.25) return;
                last.style.height = (last.offsetHeight + Math.abs(gap)) + 'px';
                last.style.objectFit = 'cover';
              };
              level();
              window.addEventListener('resize', level);
            });
        }

        if (!isMobile) ready.then(() => {
          // Each column scrolls independently so different heights don't cause glitches
          let y1 = -startOffset, y2 = -startOffset;
          const speed = 0.2;
          let wheelVelocity = 0;
          let autoScrolling = true;
          let idleTimer = null;

          function getTrackHeight(el) {
            // height of one copy = total / 2 (images are doubled)
            return el.scrollHeight / 2;
          }

          function wrap(y, h) {
            if (h <= 0) return y;
            return ((y % h) - h) % h;
          }

          function loop() {
            const h1 = getTrackHeight(col1);
            const h2 = getTrackHeight(col2);

            if (autoScrolling) {
              y1 -= speed;
              y2 -= speed;
            } else if (Math.abs(wheelVelocity) > 0.01) {
              y1 += wheelVelocity;
              y2 += wheelVelocity;
              wheelVelocity *= 0.92;
            }

            y1 = wrap(y1, h1);
            y2 = wrap(y2, h2);

            col1.style.transform = `translateY(${y1}px)`;
            col2.style.transform = `translateY(${y2}px)`;

            requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);

          rightPanel.addEventListener('wheel', e => {
            e.preventDefault();
            autoScrolling = false;
            wheelVelocity = -e.deltaY * 0.15;

            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
              wheelVelocity = 0;
              autoScrolling = true;
            }, 2000);
          }, { passive: false });
        });

      })
      .catch(() => {
        col1.innerHTML = '<p style="color:#999;padding:1rem;font-size:11px">No photos found.</p>';
      });
  </script>

</body>
</html>
