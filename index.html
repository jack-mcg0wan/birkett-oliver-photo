<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRKT — Photography</title>
  <meta name="description" content="Oliver Birkett — photographer based in London." />

  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root {
      --black: #000000;
      --white: #ffffff;
      --grey:  #888;
      --gap:   4px;
    }

    /* ═══════════════════════════════════════
       BASE
    ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: .03em;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ═══════════════════════════════════════
       LAYOUT — split: left third / right two-thirds
    ═══════════════════════════════════════ */
    .page {
      display: grid;
      grid-template-columns: 1fr 2fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════
       LEFT PANEL
    ═══════════════════════════════════════ */
    .left-panel {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 2rem 2rem 2rem;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
    }
    .brkt-logo {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
    }
    .bio {
      margin-top: 0.75rem;
      font-size: 12px;
      line-height: 1.7;
      color: #444;
      letter-spacing: .01em;
      max-width: 280px;
    }
    .bio a {
      border-bottom: 1px solid #ccc;
      transition: border-color .2s;
    }
    .bio a:hover { border-color: var(--black); }

    /* ═══════════════════════════════════════
       RIGHT PANEL — 2-col infinite scroll
    ═══════════════════════════════════════ */
    .right-panel {
      overflow: hidden;
      position: relative;
      height: 100vh;
    }

    /* Two columns side by side, each scrolling independently */
    .scroll-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 0;
      height: 100%;
    }

    .scroll-col {
      overflow: hidden;
      position: relative;
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 0;
      animation-name: scrollUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .scroll-track img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    @keyframes scrollUp {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    /* ═══════════════════════════════════════
       MOBILE — stack layout
    ═══════════════════════════════════════ */
    @media (max-width: 700px) {
      html, body { overflow: auto; }

      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        overflow: visible;
      }

      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 1.8rem 1.2rem;
      }

      .brkt-logo { max-width: 180px; }

      .right-panel {
        height: 80vh;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- ── LEFT PANEL ── -->
    <aside class="left-panel">
      <img class="brkt-logo" src="assets/brkt-logo.png" alt="BRKT" />
      <p class="bio">
        Placeholder — Oliver's bio text goes here. London-based photographer
        working across editorial, portrait and commercial. Available for commissions.
        <br><br>
        <a href="mailto:hello@birkettoliverphoto.com">Get in touch</a>
      </p>
    </aside>

    <!-- ── RIGHT PANEL — scrolling gallery ── -->
    <main class="right-panel">
      <div class="scroll-columns">
        <div class="scroll-col col-1">
          <div class="scroll-track" id="col1-track"></div>
        </div>
        <div class="scroll-col col-2">
          <div class="scroll-track" id="col2-track"></div>
        </div>
      </div>
    </main>

  </div>

  <script>
    /* ── Load photos from photos.json and split across 2 columns ── */
    const col1 = document.getElementById('col1-track');
    const col2 = document.getElementById('col2-track');
    const isMobile = window.innerWidth <= 700;

    function buildColumn(el, photos) {
      // Duplicate photos for seamless infinite loop
      const doubled = [...photos, ...photos];
      doubled.forEach(p => {
        const img = document.createElement('img');
        img.src = p.file;
        img.alt = p.alt || '';
        img.loading = 'lazy';
        el.appendChild(img);
      });
    }

    function setScrollSpeed(el, durationSeconds) {
      el.style.animationDuration = durationSeconds + 's';
    }

    fetch('photos.json')
      .then(r => r.json())
      .then(data => {
        const allPhotos = isMobile && data.photos_mobile ? data.photos_mobile : data.photos;

        // Split photos alternately between the two columns
        const left  = allPhotos.filter((_, i) => i % 2 === 0);
        const right = allPhotos.filter((_, i) => i % 2 !== 0);

        buildColumn(col1, left);
        buildColumn(col2, right);

        // Speed: ~1px per 8ms feel. More photos = longer duration.
        // Roughly 300px average image height × number of photos / 2 (duplicated)
        const baseSpeed = left.length * 12;
        setScrollSpeed(col1, baseSpeed);
        setScrollSpeed(col2, baseSpeed); // same speed, both scroll up in unison
      })
      .catch(() => {
        col1.innerHTML = '<p style="color:#999;padding:1rem;font-size:11px">No photos found.</p>';
      });
  </script>

</body>
</html>
