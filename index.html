<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRKT — Photography</title>
  <meta name="description" content="Oliver Birkett — photographer based in London." />

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: .03em;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ── LAYOUT: left third / right two-thirds ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 2fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;   /* vertically centres the logo */
      padding: 2rem;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
      position: relative;        /* needed for absolute bio */
    }

    .brkt-logo {
      width: 80%;
      max-width: 240px;
      height: auto;
      display: block;
    }

    /* bio sits just below centre, between logo and bottom of panel */
    .bio {
      margin-top: 2rem;
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 10px;
      line-height: 1.6;
      color: #000;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      overflow: hidden;
      position: relative;
      height: 100vh;
    }

    .scroll-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
    }

    .scroll-col {
      overflow: hidden;
      position: relative;
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 0;
      will-change: transform;
    }

    .scroll-track img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        overflow: visible;
      }
      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 1.8rem 1.2rem;
        min-height: 220px;
      }
      .brkt-logo { max-width: 160px; }
      .right-panel { height: 80vh; }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <img class="brkt-logo" src="assets/brkt-logo.png" alt="BRKT" />
      <p class="bio">Oliver Birkett is a photographer<br>based in London</p>
    </aside>

    <!-- RIGHT PANEL — scrolling gallery -->
    <main class="right-panel" id="right-panel">
      <div class="scroll-columns">
        <div class="scroll-col">
          <div class="scroll-track" id="col1-track"></div>
        </div>
        <div class="scroll-col">
          <div class="scroll-track" id="col2-track"></div>
        </div>
      </div>
    </main>

  </div>

  <script>
    const col1 = document.getElementById('col1-track');
    const col2 = document.getElementById('col2-track');
    const rightPanel = document.getElementById('right-panel');
    const isMobile = window.innerWidth <= 700;

    function buildColumn(el, photos) {
      [...photos, ...photos].forEach(p => {
        const img = document.createElement('img');
        img.src = p.file;
        img.alt = p.alt || '';
        img.loading = 'lazy';
        el.appendChild(img);
      });
    }

    fetch('photos.json')
      .then(r => r.json())
      .then(data => {
        const allPhotos = isMobile && data.photos_mobile ? data.photos_mobile : data.photos;
        const left  = allPhotos.filter((_, i) => i % 2 === 0);
        const right = allPhotos.filter((_, i) => i % 2 !== 0);

        buildColumn(col1, left);
        buildColumn(col2, right);

        const duration = left.length * 12; // seconds per full loop
        col1.style.animationDuration = duration + 's';
        col2.style.animationDuration = duration + 's';

        // ── Wheel scroll: scrub through photos without scrolling the page ──
        let trackHeight = 0;
        let offset = 0;
        let paused = false;
        let resumeTimer = null;

        // Measure once images have started loading
        setTimeout(() => {
          trackHeight = col1.scrollHeight / 2;
        }, 500);
        window.addEventListener('load', () => {
          trackHeight = col1.scrollHeight / 2;
        });

        function getAnimY(el) {
          const m = new DOMMatrix(window.getComputedStyle(el).transform);
          return m.m42;
        }

        rightPanel.addEventListener('wheel', e => {
          e.preventDefault(); // stop the page from scrolling

          if (!paused) {
            offset = getAnimY(col1);
            col1.style.animationPlayState = 'paused';
            col2.style.animationPlayState = 'paused';
            paused = true;
          }

          offset -= e.deltaY * 0.6;

          // Wrap so it loops seamlessly
          if (trackHeight > 0) {
            offset = ((offset % trackHeight) - trackHeight) % trackHeight;
          }

          col1.style.transform = `translateY(${offset}px)`;
          col2.style.transform = `translateY(${offset}px)`;

          // Resume auto-scroll 2s after last wheel event
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(() => {
            const pct = Math.abs(offset) / (trackHeight || 1);
            const elapsed = pct * duration;
            col1.style.animationDelay = `-${elapsed}s`;
            col2.style.animationDelay = `-${elapsed}s`;
            col1.style.transform = '';
            col2.style.transform = '';
            col1.style.animationPlayState = 'running';
            col2.style.animationPlayState = 'running';
            paused = false;
          }, 2000);

        }, { passive: false });
      })
      .catch(() => {
        col1.innerHTML = '<p style="color:#999;padding:1rem;font-size:11px">No photos found.</p>';
      });
  </script>

</body>
</html>
