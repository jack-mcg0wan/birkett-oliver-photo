<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRKT — Photography</title>
  <meta name="description" content="Oliver Birkett — photographer based in London." />

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: .03em;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ── LAYOUT: left third / right two-thirds ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 2fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
    }

    .brkt-logo {
      width: 60%;
      max-width: 200px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .bio {
      margin-top: 1.4rem;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: 9.5px;
      line-height: 1.55;
      color: #000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── SINGLE CONTACT BUTTON ── */
    .contact-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.2rem;
      border: 1px solid #000;
      padding: 8px 18px 7px;
      cursor: pointer;
      text-align: center;
      flex-shrink: 0;
      transition: background .15s, color .15s;
      text-decoration: none;
      color: #000;
    }
    .contact-btn:hover {
      background: #000;
      color: #fff;
    }
    .contact-btn .btn-label {
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: 9.5px;
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .contact-btn .btn-insta {
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 8px;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-top: 3px;
      opacity: 0.65;
      line-height: 1;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      overflow: hidden;
      position: relative;
      height: 100vh;
    }

    .scroll-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
    }

    .scroll-col {
      overflow: hidden;
      position: relative;
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 0;
      will-change: transform;
    }

    .scroll-track img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        overflow: visible;
      }
      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 1.8rem 1.2rem;
        min-height: 220px;
      }
      .brkt-logo { max-width: 160px; }
      .right-panel { height: 80vh; }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <img class="brkt-logo" src="assets/brkt-logo.png" alt="BRKT" />
      <p class="bio">Oliver Birkett is a photographer<br>based in London</p>
      <a class="contact-btn" href="mailto:hello@birkettoliverphoto.com">
        <span class="btn-label">Contact</span>
        <span class="btn-insta">@_birkettoliver</span>
      </a>
    </aside>

    <!-- RIGHT PANEL — scrolling gallery -->
    <main class="right-panel" id="right-panel">
      <div class="scroll-columns">
        <div class="scroll-col">
          <div class="scroll-track" id="col1-track"></div>
        </div>
        <div class="scroll-col">
          <div class="scroll-track" id="col2-track"></div>
        </div>
      </div>
    </main>

  </div>

  <script>
    const col1 = document.getElementById('col1-track');
    const col2 = document.getElementById('col2-track');
    const rightPanel = document.getElementById('right-panel');
    const isMobile = window.innerWidth <= 700;

    function buildColumn(el, photos) {
      [...photos, ...photos].forEach(p => {
        const img = document.createElement('img');
        img.src = p.file;
        img.alt = p.alt || '';
        img.loading = 'lazy';
        el.appendChild(img);
      });
    }

    fetch('photos.json')
      .then(r => r.json())
      .then(data => {
        const allPhotos = isMobile && data.photos_mobile ? data.photos_mobile : data.photos;
        const left  = allPhotos.filter((_, i) => i % 2 === 0);
        const right = allPhotos.filter((_, i) => i % 2 !== 0);

        buildColumn(col1, left);
        buildColumn(col2, right);

        // ── rAF-based scroll: single y value drives everything ──
        let y = 0;
        let speed = 0.2;
        let wheelVelocity = 0;
        let trackHeight = 0;
        let autoScrolling = true;
        let idleTimer = null;

        function apply() {
          const ty = `translateY(${y}px)`;
          col1.style.transform = ty;
          col2.style.transform = ty;
        }

        function loop() {
          if (col1.scrollHeight > 0) trackHeight = col1.scrollHeight / 2;

          if (trackHeight > 0) {
            if (autoScrolling) {
              y -= speed;
            } else if (Math.abs(wheelVelocity) > 0.1) {
              y += wheelVelocity;
              wheelVelocity *= 0.92;
            }
            y = ((y % trackHeight) - trackHeight) % trackHeight;
            apply();
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        rightPanel.addEventListener('wheel', e => {
          e.preventDefault();
          autoScrolling = false;
          wheelVelocity = -e.deltaY * 0.15;

          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            wheelVelocity = 0;
            autoScrolling = true;
          }, 2000);
        }, { passive: false });

      })
      .catch(() => {
        col1.innerHTML = '<p style="color:#999;padding:1rem;font-size:11px">No photos found.</p>';
      });
  </script>

</body>
</html>
